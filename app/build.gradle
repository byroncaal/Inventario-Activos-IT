plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
file("../local.properties").withInputStream { localProperties.load(it) }

android {
    namespace 'com.example.activo_it'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.activo_it"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "ADMIN_DEFAULT_PASSWORD",
                "\"${localProperties.getProperty('ADMIN_DEFAULT_PASSWORD', 'admin123')}\""
        buildConfigField "String", "ICECAT_API_TOKEN",
                "\"${localProperties.getProperty('ICECAT_API_TOKEN', '')}\""
        buildConfigField "String", "ICECAT_CONTENT_TOKEN",
                "\"${localProperties.getProperty('ICECAT_CONTENT_TOKEN', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}